name: tradepilotapp
description: "Trade Pilot — AI Trading Assistant (Flutter mobile app)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Generated Trade Pilot API client (vendored from Trade-Pilot repo, lib/api-client-dart)
  trade_pilot_api_client:
    path: packages/trade_pilot_api_client

  # Networking
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Local/secure storage for session token + cached user
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  fl_chart: ^0.69.0
  built_collection: ^5.1.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
