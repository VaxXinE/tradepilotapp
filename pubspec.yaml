name: tradepilotapp
description: "Trade Pilot — AI Trading Assistant (Flutter mobile app)."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Generated Trade Pilot API client (vendored from Trade-Pilot repo, lib/api-client-dart)
  trade_pilot_api_client:
    path: packages/trade_pilot_api_client

  # Networking
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Local/secure storage for session token + cached user
  flutter_secure_storage: ^9.2.2
  in_app_update: ^4.2.5
  local_auth: ^3.0.2
  shared_preferences: ^2.3.3
  upgrader: ^13.7.0
  url_launcher: ^6.3.2

  # Utilities
  intl: ^0.20.2
  fl_chart: ^0.69.0
  built_collection: ^5.1.1
  one_of: ^1.5.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
